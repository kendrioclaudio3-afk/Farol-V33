<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060913">
  <title>Farol de Manutencao Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    html, body, #root { min-height: 100vh; background-color: #060913; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    @keyframes farolMenuIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes farolSoftPop {
      0% { transform: scale(0.94); opacity: 0.75; }
      100% { transform: scale(1); opacity: 1; }
    }
    .farol-status-menu { animation: farolMenuIn 150ms cubic-bezier(.2,.8,.2,1); transform-origin: top left; }
    .farol-status-option { transition: background-color 140ms ease, transform 140ms ease, color 140ms ease; }
    .farol-status-option:active { transform: scale(0.96); }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    
    window.firebaseModules = {
      initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken,
      getFirestore, doc, setDoc, onSnapshot
    };
  </script>
</head>

<body class="antialiased pb-24 text-[14px]">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STATUS_OPTIONS = [
      { id: 'none', icon: '▪️', label: 'Sem Bolinha (Sub-item)' },
      { id: 'sub_inicio', icon: '├─ ▪️', label: 'Início:' },
      { id: 'sub_termino', icon: '├─ ▪️', label: 'Término:' },
      { id: 'sub_duracao', icon: '└─ ▪️', label: 'Duração:' },
      { id: 'not_started', icon: '⚪', label: 'Não iniciado' },
      { id: 'in_progress', icon: '🟡', label: 'Em andamento' },
      { id: 'completed', icon: '🟢', label: 'Concluído' },
      { id: 'delayed', icon: '🔴', label: 'Atrasado' },
      { id: 'cancelled', icon: '❌', label: 'Cancelado' }
    ];

    const INITIAL_DATA = {
      title: 'MP VV-03',
      expectedStart: '02/09/2026 ÀS 12:30',
      expectedEnd: '05/09/2026 ÀS 12:00',
      tasks: [
        { id: 's1', isSection: true, name: 'MECÂNICA', status: 'none', startTime: '', endTime: '', duration: '', startTimeMs: null, endTimeMs: null },
        { id: '1', isSection: false, name: '[Trocar] Paraf da crem do c.p do VV3', status: '⚪', startTime: '', endTime: '', duration: '', progress: '', startTimeMs: null, endTimeMs: null },
      ]
    };

    const DynamicCalendar = ({ textValue, darkMode }) => {
      const match = textValue?.match(/(\d{1,2})\//);
      const day = match ? match[1] : '';
      if (!day) return <span className="text-[1.1em]">📆</span>;
      return (
        <div className={`relative inline-flex items-center justify-center w-[1.4em] h-[1.4em] ${darkMode ? 'bg-slate-800 text-white' : 'bg-white text-slate-900'} rounded shadow-sm border ${darkMode ? 'border-slate-700' : 'border-slate-300'} overflow-hidden flex-shrink-0 mx-1`}>
          <div className="absolute top-0 w-full h-[30%] bg-rose-500"></div>
          <span className="font-black mt-[4px] leading-none tracking-tighter" style={{ fontSize: '0.65em' }}>{day}</span>
        </div>
      );
    };

    function App() {
      const STORAGE_KEY = 'farol_pro_dados_v32';
      const TEMPLATE_KEY = 'farol_pro_templates_v32';

      const [data, setData] = useState(() => {
        try {
          const savedLocal = localStorage.getItem(STORAGE_KEY);
          if (savedLocal) return JSON.parse(savedLocal);
        } catch (e) {}
        return INITIAL_DATA;
      });

      const [user, setUser] = useState(null);
      const [db, setDb] = useState(null);
      const [appId, setAppId] = useState('default-farol-pro-id');

      const [sectionInputs, setSectionInputs] = useState({});
      const [newSectionName, setNewSectionName] = useState('');
      
      const [wppMode, setWppMode] = useState('DURACAO_AUTO');
      const [pdfIncludeHours, setPdfIncludeHours] = useState(true);
      const [zoomLevel, setZoomLevel] = useState(2); 

      const [showTemplates, setShowTemplates] = useState(false);
      const [templateSearch, setTemplateSearch] = useState(''); 
      const [showPdfModal, setShowPdfModal] = useState(false);
      const [showChartModal, setShowChartModal] = useState(false);
      const [showSummary, setShowSummary] = useState(false);
      const [summaryMessage, setSummaryMessage] = useState('');
      const [showMenuDropdown, setShowMenuDropdown] = useState(false);
      
      const [pdfCustomTitle, setPdfCustomTitle] = useState('');
      const [pdfCustomStart, setPdfCustomStart] = useState('');
      const [pdfCustomEnd, setPdfCustomEnd] = useState('');
      const [pdfCustomTasks, setPdfCustomTasks] = useState([]);
      const [pdfChartDataUrl, setPdfChartDataUrl] = useState('');
      
      const [activeStatusMenu, setActiveStatusMenu] = useState(null);
      const [expandedTasks, setExpandedTasks] = useState({});
      const [darkMode, setDarkMode] = useState(true);

      const [modal, setModal] = useState({ isOpen: false, type: '', data: null });
      const [promptInput, setPromptInput] = useState('');
      const [importText, setImportText] = useState('');
      const [copySuccess, setCopySuccess] = useState(false);
      const [backupMessage, setBackupMessage] = useState('');
      const [undoAction, setUndoAction] = useState(null);
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
      const backupInputRef = useRef(null);
      const undoTimerRef = useRef(null);
      
      const [saveStatus, setSaveStatus] = useState('LOCAL');
      const [isCloudActive, setIsCloudActive] = useState(false); 
      const [isDataLoaded, setIsDataLoaded] = useState(false);

      const menuRef = useRef(null);
      const dropdownRef = useRef(null);
      const taskInputRefs = useRef({});
      const topicInputRef = useRef(null);
      const pdfContentRef = useRef(null);
      const chartCanvasRef = useRef(null);
      const debounceTimer = useRef(null);
      const lastEnterTime = useRef({});

      const [templates, setTemplates] = useState(() => {
        try {
          const saved = localStorage.getItem(TEMPLATE_KEY);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return [];
      });

      useEffect(() => { document.body.style.backgroundColor = darkMode ? '#060913' : '#f1f5f9'; }, [darkMode]);

      useEffect(() => {
         const interval = setInterval(() => { setData(prev => ({ ...prev })); }, 60000);
         return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        const initEnvironment = async () => {
          let fConfig = null;
          try { fConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null; } catch (e) {}
          if (!fConfig) { setIsDataLoaded(true); return; }
          if (!window.firebaseModules) { setTimeout(initEnvironment, 500); return; }
          try {
            const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, getFirestore } = window.firebaseModules;
            const app = initializeApp(fConfig);
            const auth = getAuth(app);
            setDb(getFirestore(app));
            setAppId(typeof __app_id !== 'undefined' ? __app_id : 'farol-pro');
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
            else await signInAnonymously(auth);
            onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              if (currentUser) setIsCloudActive(true);
              else setIsDataLoaded(true);
            });
          } catch (error) { setIsDataLoaded(true); }
        };
        initEnvironment();
      }, []);

      useEffect(() => {
        if (!isCloudActive || !user || !db || !window.firebaseModules) return;
        const { doc, onSnapshot } = window.firebaseModules;
        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'farol_data', 'current_board');
        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const serverData = docSnap.data();
            if (serverData && serverData.tasks) setData(serverData);
          }
          setSaveStatus('NUVEM');
          setIsDataLoaded(true);
        });
        return () => unsubscribe();
      }, [isCloudActive, user, db, appId]);

      const saveToCloud = (dataToSave) => {
        if (!user || !db || !window.firebaseModules) return;
        setSaveStatus('A GRAVAR...');
        clearTimeout(debounceTimer.current);
        debounceTimer.current = setTimeout(async () => {
          try {
            const { doc, setDoc } = window.firebaseModules;
            const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'farol_data', 'current_board');
            await setDoc(docRef, dataToSave);
            setSaveStatus('NUVEM');
          } catch (error) { setSaveStatus('ERRO'); }
        }, 800); 
      };

      const updateAndSave = (updater) => {
        setData(prev => {
          const nextData = typeof updater === 'function' ? updater(prev) : updater;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(nextData)); } catch (e) {}
          if (isCloudActive) { saveToCloud(nextData); } else { setSaveStatus('LOCAL'); }
          return nextData;
        });
      };

      useEffect(() => {
        try { localStorage.setItem(TEMPLATE_KEY, JSON.stringify(templates)); } catch (e) {}
      }, [templates]);

      useEffect(() => {
        function handleClickOutside(event) {
          if (menuRef.current && !menuRef.current.contains(event.target)) setActiveStatusMenu(null);
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setShowMenuDropdown(false);
        }
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside, {passive: true});
        return () => {
           document.removeEventListener("mousedown", handleClickOutside);
           document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);

      const toggleExpand = (taskId) => setExpandedTasks(prev => ({ ...prev, [taskId]: !prev[taskId] }));

      const getLiveDurationString = (startMs, endMs, status) => {
          if (!startMs) return '';
          const end = endMs || (status === '🟡' ? Date.now() : null);
          if (!end && status !== '🟡') return '';
          const diffMs = (end || Date.now()) - startMs;
          const totalMins = Math.floor(diffMs / 60000);
          const h = Math.floor(totalMins / 60);
          const m = totalMins % 60;
          if (h > 0 && m > 0) return `${h}h${m}m`;
          if (h > 0) return `${h}h`;
          if (m > 0) return `${m}m`;
          return `0m`;
      };

      const formatTimeString = (ms) => {
          if (!ms) return '';
          const d = new Date(ms);
          return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      };

      const handleAutoTime = (taskId, field) => { updateTaskField(taskId, field, Date.now()); };

      const updateTaskField = (taskId, field, value) => {
        updateAndSave(prevData => {
          const newTasks = prevData.tasks.map(task => {
            if (task.id === taskId) {
              const updated = { ...task, [field]: value };
              
              if (field === 'status') {
                 if (value === '🟡' && task.status !== '🟡') {
                     if (!updated.startTimeMs) { updated.startTimeMs = Date.now(); updated.startTime = formatTimeString(updated.startTimeMs); }
                     updated.endTimeMs = null; updated.endTime = ''; 
                 } else if (value === '🟢') {
                     if (!updated.startTimeMs) { updated.startTimeMs = Date.now(); updated.startTime = formatTimeString(updated.startTimeMs); }
                     if (!updated.endTimeMs) { updated.endTimeMs = Date.now(); updated.endTime = formatTimeString(updated.endTimeMs); }
                 } else if (value === '⚪' || value === '❌' || value === '🔴') {
                     // Limpa apenas se for reiniciada, cancelada ou atrasada
                     updated.startTimeMs = null; updated.endTimeMs = null;
                     updated.progress = ''; updated.startTime = ''; updated.endTime = '';
                 }
              }

              if (field === 'startTimeMs') updated.startTime = formatTimeString(value);
              if (field === 'endTimeMs') updated.endTime = formatTimeString(value);

              return updated;
            }
            return task;
          });
          return { ...prevData, tasks: newTasks };
        });
      };

      const updatePdfTaskField = (taskId, field, value) => {
        setPdfCustomTasks(prev => prev.map(task => {
          if (task.id === taskId) {
            return { ...task, [field]: value };
          }
          return task;
        }));
      };

      const calculateSectionProgress = () => {
        const progress = {};
        let currentSectionId = null;
        let totalTasks = 0, completedTasks = 0;

        data.tasks.forEach((task) => {
          if (task.isSection) {
            if (currentSectionId) progress[currentSectionId] = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
            currentSectionId = task.id;
            totalTasks = 0; completedTasks = 0; 
          } else {
            if (task.status !== 'none' && task.status !== '▪️' && task.status !== '▫️' && task.status !== '◾') {
              totalTasks++;
              if (task.status === '🟢') { completedTasks += 1; } 
              else if (task.status === '🟡' && task.progress) {
                 const p = parseFloat(task.progress);
                 if (!isNaN(p)) completedTasks += (p / 100);
              }
            }
          }
        });
        if (currentSectionId) progress[currentSectionId] = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
        return progress;
      };

      const sectionProgress = calculateSectionProgress();

      // Resumo adicional: não altera a lógica das tarefas existentes.
      const summary = data.tasks.reduce((acc, task) => {
        if (task.isSection || task.status === '▪️' || task.status === '▫️' || task.status === '◾') return acc;
        acc.total += 1;
        if (task.status === '🟢') acc.completed += 1;
        else if (task.status === '🟡') {
          acc.inProgress += 1;
          const pct = parseFloat(String(task.progress || '').replace(',', '.'));
          if (!isNaN(pct)) acc.progressPoints += Math.min(100, Math.max(0, pct)) / 100;
        } else if (task.status === '🔴') acc.delayed += 1;
        else if (task.status === '❌') acc.cancelled += 1;
        else acc.notStarted += 1;
        return acc;
      }, { total: 0, completed: 0, inProgress: 0, delayed: 0, cancelled: 0, notStarted: 0, progressPoints: 0 });
      const overallProgress = summary.total > 0
        ? Math.round(((summary.completed + summary.progressPoints) / summary.total) * 100)
        : 0;

      // Gráfico por modalidade: cada tópico vira uma fatia.
      // As fatias representam a quantidade de atividades; o progresso da modalidade aparece na legenda.
      const modalityColors = ['#3b82f6', '#8b5cf6', '#14b8a6', '#f59e0b', '#ec4899', '#22c55e', '#ef4444', '#06b6d4'];
      const chartStatusData = [];
      let currentModality = null;
      data.tasks.forEach(task => {
        if (task.isSection) {
          currentModality = {
            key: task.id,
            label: task.name || 'Sem nome',
            color: modalityColors[chartStatusData.length % modalityColors.length],
            count: 0,
            progress: sectionProgress[task.id] || 0,
            statusCounts: { completed: 0, inProgress: 0, notStarted: 0, delayed: 0, cancelled: 0 }
          };
          chartStatusData.push(currentModality);
        } else if (currentModality && !['▪️', '▫️', '◾'].includes(task.status)) {
          currentModality.count += 1;
          if (task.status === '🟢') currentModality.statusCounts.completed += 1;
          else if (task.status === '🟡') currentModality.statusCounts.inProgress += 1;
          else if (task.status === '🔴') currentModality.statusCounts.delayed += 1;
          else if (task.status === '❌') currentModality.statusCounts.cancelled += 1;
          else currentModality.statusCounts.notStarted += 1;
        }
      });
      const modalityProgressValues = chartStatusData.map(item => item.progress);
      const averagePercentage = modalityProgressValues.length === 0
        ? 0
        : modalityProgressValues.reduce((sum, value) => sum + value, 0) / modalityProgressValues.length;

      const blobToDataUrl = (blob) => new Promise((resolve, reject) => {
        if (!blob) { reject(new Error('Arquivo vazio')); return; }
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });

      const canvasToBlob = (canvas, type = 'image/png', quality) => new Promise((resolve, reject) => {
        try {
          if (canvas && typeof canvas.toBlob === 'function') {
            canvas.toBlob(blob => {
              if (blob) resolve(blob);
              else reject(new Error('Não foi possível criar o arquivo'));
            }, type, quality);
          } else if (canvas) {
            fetch(canvas.toDataURL(type, quality)).then(response => response.blob()).then(resolve).catch(reject);
          } else reject(new Error('Gráfico indisponível'));
        } catch (error) { reject(error); }
      });

      const isEmbeddedApp = () => {
        const ua = navigator.userAgent || '';
        return /; wv\)|\bWebView\b|Instagram|FBAN|FBAV/i.test(ua) ||
          window.matchMedia?.('(display-mode: standalone)').matches || navigator.standalone === true;
      };

      const downloadFile = (blob, filename) => {
        if (!blob) return false;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.rel = 'noopener';
        a.style.display = 'none';
        if (isEmbeddedApp()) {
          // Em WebViews o atributo download costuma ser ignorado. Abrimos o
          // arquivo para o menu nativo do aparelho (Salvar/Compartilhar).
          a.target = '_blank';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } else {
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
        setTimeout(() => {
          try { URL.revokeObjectURL(url); } catch (e) {}
        }, 30000);
        return true;
      };

      const shareOrDownloadFile = async (blob, filename, title, text = '') => {
        if (!blob) return false;
        const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
        try {
          const canShareFiles = typeof navigator.share === 'function' &&
            (!navigator.canShare || navigator.canShare({ files: [file] }));
          if (canShareFiles) {
            await navigator.share({ files: [file], title, text });
            return true;
          }
        } catch (error) {
          if (error?.name === 'AbortError') return false;
        }
        return downloadFile(blob, filename);
      };

      const exportBackup = () => {
        const backup = {
          app: 'Farol Pro',
          version: 1,
          exportedAt: new Date().toISOString(),
          data,
          templates
        };
        const date = new Date().toISOString().slice(0, 10);
        downloadFile(new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' }), `farol-pro-backup-${date}.json`);
        setBackupMessage('Backup exportado.');
        setTimeout(() => setBackupMessage(''), 2500);
      };

      const drawActivityChart = (targetCanvas = chartCanvasRef.current) => {
        const canvas = targetCanvas;
        if (!canvas) return;
        const width = 1600, height = 1020;
        // Em WebViews Android, canvas grande com DPR 2/3 pode ficar vazio por limite de memória.
        // Mantemos a arte em 1600x1020 e usamos DPR 1; continua nítida e exportável.
        const dpr = 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.aspectRatio = `${width} / ${height}`;
        const ctx = canvas.getContext('2d', { alpha: false });
        if (!ctx) return;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, width, height);

        const roundedRect = (x, y, w, h, r, fill, stroke = null) => {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();
          if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
        };

        const total = chartStatusData.reduce((sum, item) => sum + item.count, 0);
        const roundedAverage = Math.round(averagePercentage);
        const navy = '#0f172a';
        const muted = '#64748b';
        const border = '#e2e8f0';
        const page = '#f8fafc';

        // Página clara, própria para salvar, imprimir e compartilhar.
        ctx.fillStyle = page;
        ctx.fillRect(0, 0, width, height);
        const header = ctx.createLinearGradient(0, 0, width, 0);
        header.addColorStop(0, '#0f172a');
        header.addColorStop(1, '#1e3a8a');
        ctx.fillStyle = header;
        ctx.fillRect(0, 0, width, 152);
        ctx.fillStyle = '#60a5fa';
        ctx.fillRect(0, 148, width, 4);

        // Cabeçalho
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 40px Arial, sans-serif';
        ctx.fillText('FAROL PRO', 58, 62);
        ctx.fillStyle = '#bfdbfe';
        ctx.font = '700 23px Arial, sans-serif';
        ctx.fillText('RELATÓRIO VISUAL DE MANUTENÇÃO', 58, 99);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 25px Arial, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(data.title || 'Manutenção sem título', 1542, 62);
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '500 16px Arial, sans-serif';
        ctx.fillText(`${data.expectedStart || 'Início não informado'}  •  ${data.expectedEnd || 'Término não informado'}`, 1542, 94);
        ctx.fillStyle = '#dbeafe';
        ctx.font = '700 13px Arial, sans-serif';
        ctx.fillText('RESUMO EXECUTIVO', 1542, 124);
        ctx.textAlign = 'left';

        // Indicadores
        const metricCard = (x, label, value, color) => {
          roundedRect(x, 182, 250, 88, 12, '#ffffff', border);
          ctx.fillStyle = color;
          ctx.fillRect(x, 182, 250, 4);
          ctx.fillStyle = muted;
          ctx.font = '700 12px Arial, sans-serif';
          ctx.fillText(label.toUpperCase(), x + 20, 211);
          ctx.fillStyle = navy;
          ctx.font = '800 30px Arial, sans-serif';
          ctx.fillText(value, x + 20, 249);
        };
        metricCard(58, 'Total de atividades', `${total}`, '#2563eb');

      const addSection = () => {
        if (!newSectionName.trim()) return;
        const newSection = { id: Date.now().toString(), isSection: true, name: newSectionName.trim().toUpperCase().replace(/\*/g, ''), status: 'none', startTime: '', endTime: '', duration: '', startTimeMs: null, endTimeMs: null };
        updateAndSave(prev => ({ ...prev, tasks: [...prev.tasks, newSection] }));

      const handleAddSectionTask = (sectionId) => {
        const rawText = sectionInputs[sectionId];
        if (!rawText || !rawText.trim()) return;
        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length === 0) return;

        updateAndSave(prev => {
          const sectionIndex = prev.tasks.findIndex(t => t.id === sectionId);
          if (sectionIndex === -1) return prev;
          let insertIndex = sectionIndex + 1;
          while (insertIndex < prev.tasks.length && !prev.tasks[insertIndex].isSection) insertIndex++;

          const newTasksAdded = lines.map((line, idx) => {
            const isSub = line.match(/^[-▫️▪️◾]/);
            const cleanName = line.replace(/^[-▫️▪️◾]\s*/, '');
            return {
                id: (Date.now() + idx).toString(), isSection: false, name: cleanName, status: isSub ? '▪️' : '⚪', startTime: '', endTime: '', duration: '', progress: '', startTimeMs: null, endTimeMs: null
            };
          });

          const newTasks = [...prev.tasks];
          newTasks.splice(insertIndex, 0, ...newTasksAdded);
          return { ...prev, tasks: newTasks };
        });
        setSectionInputs(prev => ({ ...prev, [sectionId]: '' }));
      };

      const handleTaskPaste = (e, taskId, index, currentText) => {
        const paste = e.clipboardData.getData('text');
        if (paste.includes('\n')) {
          e.preventDefault();
          const lines = paste.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
          if (lines.length === 0) return;

          updateAndSave(prev => {
            const newTasks = [...prev.tasks];
            const taskIndex = newTasks.findIndex(t => t.id === taskId);
            if (taskIndex !== -1) newTasks[taskIndex] = { ...newTasks[taskIndex], name: currentText + lines[0] };

            if (lines.length > 1) {
              const newTasksAdded = lines.slice(1).map((line, idx) => {
                const isSub = line.match(/^[-▫️▪️◾]/);
                const cleanName = line.replace(/^[-▫️▪️◾]\s*/, '');
                return {
                    id: (Date.now() + idx).toString(), isSection: false, name: cleanName, status: isSub ? '▪️' : '⚪', startTime: '', endTime: '', duration: '', progress: '', startTimeMs: null, endTimeMs: null
                };
              });
              newTasks.splice(index + 1, 0, ...newTasksAdded);
            }
            return { ...prev, tasks: newTasks };
          });

      const clearSectionTasks = (sectionId) => {
        updateAndSave(prev => {
          const newTasks = [];
          let skip = false;
          for (let i = 0; i < prev.tasks.length; i++) {
            const task = prev.tasks[i];
            if (task.id === sectionId) { newTasks.push(task); skip = true; continue; }
            if (skip) { if (task.isSection) { skip = false; newTasks.push(task); } } else { newTasks.push(task); }
          }
          return { ...prev, tasks: newTasks };
        });
      };

      const offerUndo = (message, restore) => {
        clearTimeout(undoTimerRef.current);
        setUndoAction({ message, restore });
        undoTimerRef.current = setTimeout(() => setUndoAction(null), 6000);

      const undoLastAction = () => {

        clearTimeout(undoTimerRef.current);

        setUndoAction(null);
        action.restore();

      const removeTask = (taskId) => {
        const removedIndex = data.tasks.findIndex(task => task.id === taskId);
        const removedTask = removedIndex >= 0 ? data.tasks[removedIndex] : null;
        if (!removedTask) return;
        updateAndSave(prev => ({ ...prev, tasks: prev.tasks.filter(t => t.id !== taskId) }));
        offerUndo('Tarefa excluída.', () => updateAndSave(prev => {
          if (prev.tasks.some(task => task.id === removedTask.id)) return prev;
          const tasks = [...prev.tasks];
          const insertAt = Math.min(removedIndex, tasks.length);
          tasks.splice(insertAt, 0, removedTask);
          return { ...prev, tasks };

          const newTasks = [];
          let skipping = false;
          for (let i = 0; i < prev.tasks.length; i++) {
            const t = prev.tasks[i];
            if (t.id === sectionId) { skipping = true; continue; }
            if (skipping) { if (t.isSection) { skipping = false; newTasks.push(t); } } else { newTasks.push(t); }
          }
          return { ...prev, tasks: newTasks };
        });

      const moveSectionBlock = (sectionIndex, direction) => {
        updateAndSave(prev => {
          const tasks = [...prev.tasks];
          const sections = [];
          let i = 0;
          while (i < tasks.length) {
            if (tasks[i].isSection) {
              const sIndex = i;
              let eIndex = i + 1;
              while (eIndex < tasks.length && !tasks[eIndex].isSection) eIndex++;
              sections.push({ start: sIndex, end: eIndex, items: tasks.slice(sIndex, eIndex) });
              i = eIndex;
            } else { i++; }
          }
          const currentSecIndex = sections.findIndex(s => s.start === sectionIndex);
          const targetSecIndex = direction === 'up' ? currentSecIndex - 1 : currentSecIndex + 1;
          if (targetSecIndex < 0 || targetSecIndex >= sections.length) return prev;
          [sections[currentSecIndex], sections[targetSecIndex]] = [sections[targetSecIndex], sections[currentSecIndex]];
          const newTasksList = [];
          sections.forEach(sec => newTasksList.push(...sec.items));
          return { ...prev, tasks: newTasksList };
        });
      };

      const moveTask = (index, direction) => {
        updateAndSave(prev => {
          const newTasks = [...prev.tasks];
          const targetIndex = direction === 'up' ? index - 1 : index + 1;
          if (targetIndex < 0 || targetIndex >= newTasks.length || newTasks[targetIndex].isSection || newTasks[index].isSection) return prev;
          [newTasks[index], newTasks[targetIndex]] = [newTasks[targetIndex], newTasks[index]];
          return { ...prev, tasks: newTasks };
        });
      };

      const handleDragStart = (e, index) => { e.dataTransfer.setData('text/plain', index); e.dataTransfer.effectAllowed = 'move'; };
      const handleDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };

      const handleDrop = (e, targetDropIndex) => {
        e.preventDefault();
        const draggedIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (isNaN(draggedIndex) || draggedIndex === targetDropIndex) return;

        updateAndSave(prev => {
          const tasks = [...prev.tasks];
          const draggedItem = tasks[draggedIndex];

          if (draggedItem.isSection) {
            let blockEnd = draggedIndex + 1;
            while (blockEnd < tasks.length && !tasks[blockEnd].isSection) blockEnd++;
            const blockLength = blockEnd - draggedIndex;
            const block = tasks.slice(draggedIndex, blockEnd);

            tasks.splice(draggedIndex, blockLength);
            let adjustedTargetDropIndex = targetDropIndex;
            if (draggedIndex < targetDropIndex) adjustedTargetDropIndex -= blockLength;

            let insertSectionIndex = adjustedTargetDropIndex;
            while (insertSectionIndex >= 0 && !tasks[insertSectionIndex]?.isSection) insertSectionIndex--;
            if (insertSectionIndex < 0) insertSectionIndex = 0;

            if (draggedIndex < targetDropIndex) {
               let targetBlockEnd = insertSectionIndex + 1;
               while (targetBlockEnd < tasks.length && !tasks[targetBlockEnd].isSection) targetBlockEnd++;
               insertSectionIndex = targetBlockEnd;
            }

            tasks.splice(insertSectionIndex, 0, ...block);
            return { ...prev, tasks };
          } else {
            const [movedItem] = tasks.splice(draggedIndex, 1);
            let insertIndex = targetDropIndex;
            if (draggedIndex < targetDropIndex) insertIndex -= 1;
            tasks.splice(insertIndex, 0, movedItem);
            return { ...prev, tasks };
          }
        });
      };

      const formatTaskForWpp = (task) => {
          const statusIcon = task.status === 'none' ? '' : task.status;
          let taskLine = '';
          
          if (task.status === '🟡' && task.progress) taskLine = `🟡 ${task.name} - ${task.progress}%`;
          else taskLine = `${statusIcon} ${task.name}`;

          let resultText = '';

          // Sub-item não recebe horas automáticas da gaveta no WPP
          if (task.status === '▪️' || task.status === '▫️' || task.status === '◾') {
              return taskLine + "\n";
          }

          if (wppMode === 'DURACAO_AUTO') {
             if ((task.status === '🟡' || task.status === '🟢') && task.startTimeMs) {
                 const liveStr = getLiveDurationString(task.startTimeMs, task.endTimeMs, task.status);
                 if (liveStr) taskLine += ` (${liveStr})`;
             }
             resultText = taskLine + "\n";
          } else if (wppMode === 'COM_HORAS') {
             resultText = taskLine + "\n";
             const dur = task.duration || getLiveDurationString(task.startTimeMs, task.endTimeMs, task.status);
             const st = task.startTime || formatTimeString(task.startTimeMs);
             const et = task.endTime || formatTimeString(task.endTimeMs);
             
             if (st) resultText += `▪️ Início: ${st}\n`;
             if (et) resultText += `▪️ Término: ${et}\n`;

      const buildWppText = () => {

        if (data.expectedEnd) text += `📅 Término Previsto - ${data.expectedEnd}\n\n`;

        data.tasks.forEach((task, index) => {
          if (task.isSection) {
            const pct = sectionProgress[task.id] || 0;
            if (index > 0) text += `\n`;
            // O WhatsApp interpreta o conteúdo entre asteriscos como negrito.
            // Mantemos o nome do tópico exatamente como foi cadastrado.
            text += `*${task.name}* - ${pct}%\n\n`;
          } else {
            text += formatTaskForWpp(task);
          }
        });

        text += `\nLegenda:\n\n⚪ Não iniciado\n🟡 Em andamento\n🟢 Concluído\n🔴 Atrasado\n❌ Cancelado`;
        return text;

      const copyToWhatsApp = () => copyToClipboardHelper(buildWppText());

      const processSmartImport = () => {
        if (!importText.trim()) return;
        let parsedTitle = "", parsedStart = "", parsedEnd = "", newTasks = [], currentTask = null;
        const lines = importText.split('\n');
        
        for (let i = 0; i < lines.length; i++) {
          let line = lines[i].trim();
          if (!line || line === 'Legenda:' || line.match(/⚪.? Não iniciado/i)) { 
              if (line === 'Legenda:' || line.match(/⚪.? Não iniciado/i)) break; 
              continue; 
          }
          
          if (line.match(/Início [pP]revisto/i)) { parsedStart = line.split(/Início [pP]revisto\s*[:-]?\s*/i)[1]?.trim() || parsedStart; continue; }
          if (line.match(/Término [pP]revisto/i)) { parsedEnd = line.split(/Término [pP]revisto\s*[:-]?\s*/i)[1]?.trim() || parsedEnd; continue; }

          // Horários exportados pelo modo "WPP: Com Horas" voltam para a tarefa principal.
          const detailMatch = line.match(/^▪️\s*(In[ií]cio|Término|Duração)\s*:\s*(.*)$/i);
          if (detailMatch && currentTask) {
            const detailValue = detailMatch[2].trim();
            if (/^In[ií]cio$/i.test(detailMatch[1])) currentTask.startTime = detailValue;
            else if (/^Término$/i.test(detailMatch[1])) currentTask.endTime = detailValue;
            else currentTask.duration = detailValue;
            continue;
          }
          
          // SEÇÕES
          if (!line.match(/^(⚪|🟡|🟢|🔴|❌|▫️|▪️|◾|📅|📆)/)) {
             if (!parsedTitle && newTasks.length === 0) {
                 parsedTitle = line.replace(/\*/g, '').trim();
             } else {
                 currentTask = null;
                 newTasks.push({ id: Date.now().toString(36) + Math.random().toString(36).substr(2), isSection: true, name: line.replace(/\*/g, '').replace(/-\s*\d+%$/, '').trim(), status: 'none', startTime: '', endTime: '', duration: '', progress: '', startTimeMs: null, endTimeMs: null });
             }
             continue;
          }
          
          // TAREFAS e SUB-ITENS REAIS
          const statusMatch = line.match(/^(⚪|🟡|🟢|🔴|❌|▫️|▪️|◾)\s*(.*)/);
          if (statusMatch) {
             let nameVal = statusMatch[2].trim();
             let prog = '';
             let sTimeMs = null, eTimeMs = null;
             
             // Time Travel (Engenharia Reversa) apenas se for uma tarefa principal (🟡 ou 🟢)
             if (statusMatch[1] === '🟡' || statusMatch[1] === '🟢') {
                 // Procura por (XXhXXm), (XXh), (XXm) ou até (0m) no final do nome
                 const timeMatch = nameVal.match(/\(\s*(?:(\d+)\s*h)?\s*(?:(\d+)\s*m)?\s*\)$/i);
                 if (timeMatch) {
                     const h = parseInt(timeMatch[1]) || 0;
                     const m = parseInt(timeMatch[2]) || 0;
                     const totalMs = ((h * 60) + m) * 60000;
                     
                     if (totalMs >= 0) {
                         sTimeMs = Date.now() - totalMs; 
                         if (statusMatch[1] === '🟢') { eTimeMs = Date.now(); }
                     }
                     // Apaga as horas do nome
                     nameVal = nameVal.replace(timeMatch[0], '').trim();
                 } else if (statusMatch[1] === '🟡') {
                     sTimeMs = Date.now(); // Inicia agora se não tiver tempo
                 }
                 
                 // Apaga a percentagem do nome
                 if (statusMatch[1] === '🟡' && nameVal.includes('%')) {
                     const pctMatch = nameVal.match(/-\s*([0-9.,]+)%$/);
                     if (pctMatch) { prog = pctMatch[1]; nameVal = nameVal.replace(pctMatch[0], '').trim(); }
                 }
             }

             nameVal = nameVal.replace(/\s*-\s*$/, '').trim();

             // Se for um sub-item real do WhatsApp (▪️, ◾, ▫️), usa o quadrado preto
             const iconToUse = (statusMatch[1] === '▪️' || statusMatch[1] === '◾' || statusMatch[1] === '▫️') ? '▪️' : statusMatch[1];

             currentTask = { 
                 id: Date.now().toString(36) + Math.random().toString(36).substr(2), 
                 isSection: false, 
                 name: nameVal, 
                 status: iconToUse, 
                 startTime: formatTimeString(sTimeMs), 
                 endTime: formatTimeString(eTimeMs), 
                 duration: '', 
                 progress: prog,
                 startTimeMs: sTimeMs,
                 endTimeMs: eTimeMs
             };
             newTasks.push(currentTask);
             continue;
          }
        }

          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }

            window.print();

                              value={task.name}
                              onPaste={(e) => handleTaskPaste(e, task.id, index, task.name)}
                              onChange={(e) => { updateTaskField(task.id, 'name', e.target.value); e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                              onKeyDown={(e) => { if (e.key === 'Enter') { const now = Date.now(); const last = lastEnterTime.current[task.id] || 0; if (now - last < 400) { e.preventDefault(); const cleanName = task.name.replace(/\n$/, ''); if (cleanName !== task.name) updateTaskField(task.id, 'name', cleanName); const newId = Date.now().toString(); const newTask = { id: newId, isSection: false, name: '', status: '⚪', startTime: '', endTime: '', duration: '', progress: '', startTimeMs: null, endTimeMs: null }; updateAndSave(prev => { const newTasks = [...prev.tasks]; newTasks.splice(index + 1, 0, newTask); return { ...prev, tasks: newTasks }; }); lastEnterTime.current[task.id] = 0; setTimeout(() => { if (taskInputRefs.current[newId]) taskInputRefs.current[newId].focus(); }, 50); } else { lastEnterTime.current[task.id] = now; } } }}
                              ref={(el) => { taskInputRefs.current[task.id] = el; if (el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } }}
                              placeholder="Nome da tarefa..."
                              style={{ minHeight: '22px', wordBreak: 'break-word', overflowWrap: 'break-word', paddingTop: '2px' }}
                            />

                            <div className="flex items-center gap-1.5 flex-shrink-0 self-center no-swipe-zone">
                              {task.status === '🟡' && task.progress && (
                                <button
                                  onClick={(e) => { e.stopPropagation(); setPromptInput(task.progress || ''); setModal({ isOpen: true, type: 'SET_PERCENTAGE', data: { id: task.id } }); }}
                                  onTouchStart={(e) => e.stopPropagation()}
                                  onTouchMove={(e) => e.stopPropagation()}
                                  className={`px-2 py-0.5 rounded-lg text-[10px] font-black tracking-tighter border active:scale-95 transition-transform ${theme.badgeBg}`}
                                >
                                  {task.progress}%
                                </button>
                              )}
                            </div>

                            {}
                            {(task.status !== '▪️' && task.status !== '▫️' && task.status !== '◾') && (
                                <div className="flex items-center gap-0 flex-shrink-0 self-center pl-1 no-swipe-zone">
                                  <button onClick={(e) => { e.stopPropagation(); toggleExpand(task.id); }} onTouchStart={(e) => e.stopPropagation()} onTouchMove={(e) => e.stopPropagation()} className={`p-1 rounded transition-all opacity-40 hover:opacity-100 ${ (task.startTimeMs || task.endTimeMs || task.duration || task.status === '🟡') ? 'text-white font-bold bg-white/20 opacity-100' : theme.textMuted}`}>🕒</button>
                                </div>
                            )}
                          </div>

                          {expandedTasks[task.id] && (task.status !== '▪️' && task.status !== '▫️') && (
                            <div className={`relative z-10 px-3 pb-2 ${theme.taskCard}`}>
                                <div className={`mt-0 pt-1.5 border-t ${darkMode ? 'border-slate-800' : 'border-slate-300'} flex flex-col gap-1 ${darkMode ? 'bg-slate-900/40' : 'bg-slate-100'} p-1.5 rounded-lg`} style={{ fontSize: '0.85em' }}>
                                  <div className="flex items-center justify-between gap-2">
                                    <span className={`${theme.textMuted} font-bold text-[10px] uppercase tracking-wider`}>Duração</span>
                                    <input type="text" value={task.duration || getLiveDurationString(task.startTimeMs, task.endTimeMs, task.status)} onChange={(e) => updateTaskField(task.id, 'duration', e.target.value)} className={`bg-transparent border-b ${darkMode ? 'border-slate-700' : 'border-slate-400'} px-2 py-0.5 w-28 text-center font-bold focus:outline-none`} placeholder="Ex: 01h33m" />
                                  </div>
                                  <div className="flex items-center justify-between gap-2">
                                    <span className={`${theme.textMuted} font-bold text-[10px] uppercase tracking-wider`}>Início</span>
                                    <div className="flex items-center gap-1.5">
                                      <input type="text" value={task.startTime || formatTimeString(task.startTimeMs)} onChange={(e) => updateTaskField(task.id, 'startTime', e.target.value)} className={`bg-transparent border-b ${darkMode ? 'border-slate-700' : 'border-slate-400'} px-2 py-0.5 w-20 text-center font-bold text-blue-500 focus:outline-none`} placeholder="18:00" />
                                      <button onClick={() => handleAutoTime(task.id, 'startTimeMs')} className="bg-blue-600/10 text-blue-500 px-2 py-0.5 rounded font-bold text-[10px] hover:bg-blue-600/20 transition-colors">Agora</button>
                                    </div>
                                  </div>
                                  <div className="flex items-center justify-between gap-2">
                                    <span className={`${theme.textMuted} font-bold text-[10px] uppercase tracking-wider`}>Término</span>
                                    <div className="flex items-center gap-1.5">
                                      <input type="text" value={task.endTime || formatTimeString(task.endTimeMs)} onChange={(e) => updateTaskField(task.id, 'endTime', e.target.value)} className={`bg-transparent border-b ${darkMode ? 'border-slate-700' : 'border-slate-400'} px-2 py-0.5 w-20 text-center font-bold text-emerald-500 focus:outline-none`} placeholder="19:33" />
                                      <button onClick={() => handleAutoTime(task.id, 'endTimeMs')} className="bg-emerald-600/10 text-emerald-500 px-2 py-0.5 rounded font-bold text-[10px] hover:bg-emerald-600/20 transition-colors">Agora</button>
                                    </div>
                                  </div>
                                </div>
                            </div>
                          )}
                        </div>
                      )}

                      {isNextSection && currentSectionIdForInput && (
                        <div className={`px-3 py-1 border-x border-b ${darkMode ? 'border-slate-800 bg-[#0c1322]' : 'border-slate-300 bg-slate-100'} flex items-center gap-1.5 transition-colors`} style={{ margin: 0 }}>
                          <span className="text-slate-400 font-bold ml-1 text-base self-center" style={{ marginTop: '-1px' }}>⚪</span>
                          <textarea
                            rows={1}
                            placeholder="Adicionar tarefa ou colar lista..."
                            className={`flex-1 bg-transparent py-0.5 ml-0.5 focus:outline-none font-medium text-[0.9em] resize-none self-center leading-normal ${theme.text}`}
                            value={sectionInputs[currentSectionIdForInput] || ''}
                            onChange={(e) => { setSectionInputs(prev => ({...prev, [currentSectionIdForInput]: e.target.value})); e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                            onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleAddSectionTask(currentSectionIdForInput); } }}
                            style={{ minHeight: '22px', paddingTop: '2px' }}
                          />
                          <button onClick={() => handleAddSectionTask(currentSectionIdForInput)} className="bg-blue-600 hover:bg-blue-700 text-white w-6 h-6 rounded flex items-center justify-center font-bold text-sm shadow-sm active:scale-95 flex-shrink-0 cursor-pointer self-center" title="Adicionar">+</button>
                        </div>
                      )}
                    </React.Fragment>
                  );
                })}
              </div>

              {}
              <div className={`mt-4 mb-4 p-3 rounded-xl border border-dashed ${darkMode ? 'border-slate-700/80 bg-slate-800/20' : 'border-slate-400 bg-slate-200/50'} flex items-center gap-3 shadow-sm`}>
                <span className="text-blue-500 font-bold px-1">+</span>
                <input ref={topicInputRef} type="text" placeholder="NOME DO NOVO TÓPICO..." className={`flex-1 bg-transparent font-bold tracking-wide focus:outline-none ${theme.text} text-sm uppercase placeholder-slate-500`} value={newSectionName} onChange={(e) => setNewSectionName(e.target.value.toUpperCase())} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addSection(); } }} />
                <button onClick={addSection} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm active:scale-95 transition-transform cursor-pointer">Criar</button>
              </div>

              <div className={`mt-8 mb-4 p-4 rounded-xl border ${theme.border} ${theme.cardBg} shadow-sm`} style={{ fontSize: '0.9em' }}>
                <p className="font-bold mb-3 uppercase text-slate-500 tracking-wider text-[10px]">Legenda de Status</p>
                <div className="flex flex-col gap-2.5">
                  <div className="flex items-center gap-2.5 font-medium"><span className="text-base">⚪</span> <span className={theme.textMuted}>Não iniciado</span></div>
                  <div className="flex items-center gap-2.5 font-medium"><span className="text-base">🟡</span> <span className={theme.textMuted}>Em andamento</span></div>
                  <div className="flex items-center gap-2.5 font-medium"><span className="text-base">🟢</span> <span className={theme.textMuted}>Concluído</span></div>
                  <div className="flex items-center gap-2.5 font-medium"><span className="text-base">🔴</span> <span className={theme.textMuted}>Atrasado</span></div>
                  <div className="flex items-center gap-2.5 font-medium"><span className="text-base">❌</span> <span className={theme.textMuted}>Cancelado</span></div>
                  <div className="flex items-center gap-2.5 font-medium mt-1 pt-2 border-t border-slate-700/30"><span className="text-base opacity-70">👈</span> <span className={theme.textMuted}>Deslize as <b>tarefas</b> para a esquerda para apagar</span></div>
                </div>
              </div>

              <div className="text-center mt-10 mb-12 font-bold tracking-widest text-slate-500 uppercase text-[10px] opacity-60">
                KENDRIO • FAROL PRO V32
              </div>

            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
